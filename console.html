<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setu Municipal Helpline — Human Voice Handoff Console</title>
  <!-- Agora RTC Web SDK v4 -->
  <script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.22.0.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-red: #ef4444;
      --accent-amber: #f59e0b;
      --accent-blue: #3b82f6;
      --accent-green: #10b981;
      --accent-purple: #8b5cf6;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 900px;
      margin: 0 auto 20px auto;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .header h1 {
      font-size: 20px;
      font-weight: 700;
      margin: 0;
    }

    .badge-channel {
      background-color: #1e293b;
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      color: var(--accent-green);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--accent-green);
      display: inline-block;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      border: 2px dashed var(--border-color);
      border-radius: 12px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 18px 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      position: relative;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
    }

    .status-badge {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .status-WAITING {
      background-color: rgba(245, 158, 11, 0.2);
      color: var(--accent-amber);
      border: 1px solid rgba(245, 158, 11, 0.4);
    }

    .status-ACCEPTED {
      background-color: rgba(59, 130, 246, 0.2);
      color: var(--accent-blue);
      border: 1px solid rgba(59, 130, 246, 0.4);
    }

    .status-HUMAN_CONNECTED {
      background-color: rgba(139, 92, 246, 0.25);
      color: #a78bfa;
      border: 1px solid rgba(139, 92, 246, 0.5);
    }

    .status-RESOLVED {
      background-color: rgba(16, 185, 129, 0.2);
      color: var(--accent-green);
      border: 1px solid rgba(16, 185, 129, 0.4);
    }

    .reason-badge {
      background-color: rgba(239, 68, 68, 0.15);
      color: var(--accent-red);
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .timestamp {
      font-size: 12px;
      color: var(--text-muted);
    }

    .issue-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 12px;
    }

    .grid-fields {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      background-color: #0f172a;
      padding: 10px 14px;
      border-radius: 6px;
      margin-bottom: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .field-item {
      display: flex;
      flex-direction: column;
    }

    .field-label {
      font-size: 11px;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 2px;
    }

    .field-val {
      font-size: 13px;
      font-weight: 600;
      color: #e2e8f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .field-val.missing {
      color: var(--accent-amber);
      font-style: italic;
    }

    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      font-weight: 700;
      margin-top: 10px;
      margin-bottom: 4px;
    }

    .section-body {
      font-size: 13px;
      line-height: 1.4;
      color: #cbd5e1;
      margin: 0;
    }

    .unresolved-box {
      background-color: rgba(245, 158, 11, 0.1);
      border-left: 3px solid var(--accent-amber);
      padding: 8px 12px;
      border-radius: 4px;
      margin-top: 10px;
    }

    .unresolved-box .section-title {
      color: var(--accent-amber);
      margin-top: 0;
    }

    .unresolved-box .section-body {
      color: #fde68a;
    }

    .card-actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border-color);
      align-items: center;
      flex-wrap: wrap;
    }

    .btn-action {
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-accept {
      background-color: var(--accent-blue);
      color: white;
    }

    .btn-accept:hover {
      background-color: #2563eb;
    }

    .btn-mute {
      background-color: #475569;
      color: white;
    }

    .btn-mute.muted {
      background-color: var(--accent-red);
    }

    .btn-leave {
      background-color: #dc2626;
      color: white;
    }

    .btn-resolve {
      background-color: var(--accent-green);
      color: white;
    }

    .btn-resolve:hover {
      background-color: #059669;
    }

    .btn-action:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .rtc-status {
      font-size: 12px;
      font-weight: 600;
      color: #a78bfa;
      margin-left: auto;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>🏛️ Setu Municipal Helpline — Human Voice Handoff Console</h1>
    <div class="badge-channel">
      <span class="dot"></span>
      <span>Live Voice Takeover Enabled</span>
    </div>
  </div>

  <div class="container" id="cards-container">
    <div class="empty-state" id="empty-state">
      <p>No human escalations yet. Waiting for live calls...</p>
    </div>
  </div>

  <script>
    const cardsContainer = document.getElementById("cards-container");
    const emptyState = document.getElementById("empty-state");
    const cardMap = new Map();

    // RTC Voice State
    let activeRtcClient = null;
    let activeMicTrack = null;
    let activeEscId = null;
    let isMicMuted = false;

    function renderOrUpdateCard(data) {
      if (!data || !data.escalation_id) return;
      const escId = data.escalation_id;

      if (emptyState) emptyState.style.display = "none";

      const confirmed = data.confirmed_fields || {};
      const timestamp = data.timestamp || new Date().toLocaleTimeString();
      const status = data.status || "WAITING";

      if (cardMap.has(escId)) {
        const cardElem = cardMap.get(escId);
        const badge = cardElem.querySelector(".status-badge");
        if (badge) {
          badge.className = `status-badge status-${status}`;
          badge.textContent = status === "HUMAN_CONNECTED" ? "🟢 HUMAN CONNECTED" : status;
        }

        const acceptBtn = cardElem.querySelector(".btn-accept");
        const resolveBtn = cardElem.querySelector(".btn-resolve");

        if (acceptBtn) acceptBtn.disabled = (status !== "WAITING");
        if (resolveBtn) resolveBtn.disabled = (status === "RESOLVED");

        return;
      }

      // Create new card
      const card = document.createElement("div");
      card.className = "card";
      card.id = `card-${escId}`;
      card.innerHTML = `
        <div class="card-top">
          <div style="display: flex; gap: 8px; align-items: center;">
            <span class="reason-badge">⚠️ ${escapeHtml(data.reason)}</span>
            <span class="status-badge status-${status}">${status === "HUMAN_CONNECTED" ? "🟢 HUMAN CONNECTED" : status}</span>
          </div>
          <span class="timestamp">${escapeHtml(timestamp)} | ID: ${escapeHtml(escId)}</span>
        </div>

        <div class="issue-title">📋 ${escapeHtml(data.issue_one_line || data.summary || "Issue Escalated")}</div>

        <div class="grid-fields">
          <div class="field-item">
            <span class="field-label">Phone</span>
            <span class="field-val ${!confirmed.phone && !data.phone ? 'missing' : ''}">${escapeHtml(confirmed.phone || data.phone || 'Unconfirmed')}</span>
          </div>
          <div class="field-item">
            <span class="field-label">Location</span>
            <span class="field-val ${!confirmed.location && !data.location ? 'missing' : ''}">${escapeHtml(confirmed.location || data.location || 'Unconfirmed')}</span>
          </div>
          <div class="field-item">
            <span class="field-label">Issue Type</span>
            <span class="field-val ${!confirmed.issue_type && !data.issue_type ? 'missing' : ''}">${escapeHtml(confirmed.issue_type || data.issue_type || 'Unconfirmed')}</span>
          </div>
          <div class="field-item">
            <span class="field-label">Description</span>
            <span class="field-val ${!confirmed.description && !data.description ? 'missing' : ''}">${escapeHtml(confirmed.description || data.description || 'Unconfirmed')}</span>
          </div>
        </div>

        <div class="section-title">Key Conversation Points</div>
        <p class="section-body">${escapeHtml(data.key_points || data.summary || 'None')}</p>

        <div class="unresolved-box">
          <div class="section-title">Why Human Help Is Needed</div>
          <p class="section-body">${escapeHtml(data.unresolved || 'None')}</p>
        </div>

        <div class="card-actions" id="actions-${escId}">
          <button class="btn-action btn-accept" onclick="acceptAndJoinCall('${escId}', '${escapeHtml(data.channel_name || 'default')}')" ${status !== 'WAITING' ? 'disabled' : ''}>🎙️ Accept & Join Call</button>
          <button class="btn-action btn-resolve" onclick="resolveEscalation('${escId}')" ${status === 'RESOLVED' ? 'disabled' : ''}>✅ Resolve</button>
          <span class="rtc-status" id="rtc-text-${escId}"></span>
        </div>
      `;

      cardMap.set(escId, card);
      cardsContainer.prepend(card);
    }

    async function acceptAndJoinCall(escId, channelName) {
      try {
        // 1. Accept escalation on server
        const res = await fetch(`/api/escalations/${escId}/accept`, { method: "POST" });
        if (!res.ok) {
          const err = await res.json();
          alert("Accept failed: " + (err.detail || "Invalid state transition"));
          return;
        }

        activeEscId = escId;
        const rtcStatusText = document.getElementById(`rtc-text-${escId}`);
        if (rtcStatusText) rtcStatusText.textContent = "Connecting to Voice Call...";

        // 2. Get Operator RTC token
        const tokenRes = await fetch(`/api/get_operator_token?channel_name=${encodeURIComponent(channelName)}`);
        const tokenData = await tokenRes.json();

        const appId = tokenData.app_id;
        const token = tokenData.token;
        const actualChannel = tokenData.channel_name || channelName;
        const operatorUid = tokenData.operator_uid;

        // 3. Initialize Agora RTC client and join channel
        activeRtcClient = AgoraRTC.createClient({ mode: "rtc", codec: "vp8" });

        // Subscribe to remote caller audio
        activeRtcClient.on("user-published", async (user, mediaType) => {
          if (mediaType === "audio") {
            await activeRtcClient.subscribe(user, mediaType);
            user.audioTrack.play();
            if (rtcStatusText) rtcStatusText.textContent = "🔊 Caller Audio Connected";
          }
        });

        await activeRtcClient.join(appId, actualChannel, token, operatorUid);

        // 4. Create and publish operator microphone track
        activeMicTrack = await AgoraRTC.createMicrophoneAudioTrack();
        await activeRtcClient.publish([activeMicTrack]);

        // 5. Update backend status to HUMAN_CONNECTED
        await fetch(`/api/escalations/${escId}/status`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ status: "HUMAN_CONNECTED" })
        });

        // 6. Update card UI with active audio controls
        const actionsDiv = document.getElementById(`actions-${escId}`);
        if (actionsDiv) {
          actionsDiv.innerHTML = `
            <button class="btn-action btn-mute" id="mute-btn-${escId}" onclick="toggleMute()">🎙️ Mute Mic</button>
            <button class="btn-action btn-leave" onclick="leaveCall('${escId}')">🚪 Leave Call</button>
            <button class="btn-action btn-resolve" onclick="resolveEscalation('${escId}')">✅ Resolve</button>
            <span class="rtc-status" style="color: #a78bfa;">🟢 HUMAN CONNECTED (Live)</span>
          `;
        }

        renderOrUpdateCard({ escalation_id: escId, status: "HUMAN_CONNECTED" });

      } catch (error) {
        console.error("Failed to join voice call:", error);
        alert("Failed to connect voice call: " + error.message);
        const rtcStatusText = document.getElementById(`rtc-text-${escId}`);
        if (rtcStatusText) rtcStatusText.textContent = "⚠️ Voice Connection Failed";
      }
    }

    async function toggleMute() {
      if (!activeMicTrack || !activeEscId) return;
      isMicMuted = !isMicMuted;
      await activeMicTrack.setEnabled(!isMicMuted);
      const muteBtn = document.getElementById(`mute-btn-${activeEscId}`);
      if (muteBtn) {
        muteBtn.textContent = isMicMuted ? "🔇 Unmute Mic" : "🎙️ Mute Mic";
        muteBtn.classList.toggle("muted", isMicMuted);
      }
    }

    async function leaveCall(escId) {
      if (activeMicTrack) {
        activeMicTrack.stop();
        activeMicTrack.close();
        activeMicTrack = null;
      }
      if (activeRtcClient) {
        await activeRtcClient.leave();
        activeRtcClient = null;
      }

      await fetch(`/api/escalations/${escId}/status`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ status: "HUMAN_ENDED" })
      });

      renderOrUpdateCard({ escalation_id: escId, status: "ACCEPTED" });

      const actionsDiv = document.getElementById(`actions-${escId}`);
      if (actionsDiv) {
        actionsDiv.innerHTML = `
          <button class="btn-action btn-accept" onclick="acceptAndJoinCall('${escId}', '')" disabled>🎙️ Call Ended</button>
          <button class="btn-action btn-resolve" onclick="resolveEscalation('${escId}')">✅ Resolve</button>
          <span class="rtc-status" style="color: var(--text-muted);">Operator Left Call</span>
        `;
      }
    }

    async function resolveEscalation(escId) {
      try {
        if (activeEscId === escId) {
          await leaveCall(escId);
        }
        const res = await fetch(`/api/escalations/${escId}/resolve`, { method: "POST" });
        if (res.ok) {
          const updated = await res.json();
          renderOrUpdateCard(updated);
        } else {
          const err = await res.json();
          alert("Resolve failed: " + (err.detail || "Invalid state transition"));
        }
      } catch (e) {
        alert("Error resolving escalation.");
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    async function pollEscalations() {
      try {
        const res = await fetch("/api/escalations");
        if (res.ok) {
          const items = await res.json();
          if (Array.isArray(items)) {
            items.forEach(renderOrUpdateCard);
          }
        }
      } catch (err) {
        console.warn("Poll escalations error:", err);
      }
    }

    setInterval(pollEscalations, 1500);
    pollEscalations();
  </script>
</body>
</html>
